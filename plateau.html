<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plateau Un'Gara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/jdr-ui.css">
<style>
/* ============================================================
   PLATEAU — étape 1 (26/10/2026) : carte + pions
   Mise en page : barre du haut (partie, scène, couches, outils) | plateau plein écran | inspecteur (MJ) à droite.
   Le plateau = un « monde » (div) déplacé / zoomé par transform ; 3 couches : carte, pions, MJ cachée ; + effets (mesure, ping, cercles).
   ============================================================ */
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:#11161a;padding:0}
.pbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 12px;background:var(--sheet);border-bottom:1px solid var(--line);z-index:5}
.pbar .brand{font-family:var(--f-display);font-weight:800;color:var(--ink);text-decoration:none;font-size:1.05rem}
.pbar .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pbar .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-right:2px}
.pbar select,.pbar input{padding:4px 6px;font-size:.92rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:5px 11px;font-weight:600;color:var(--ink)}
.seg button.on{background:var(--accent);color:#fff}
.seg button[data-layer="gm"].on{background:#7a2d8c}
.pbar .sp{flex:1}
.pbar .who{font-size:.88rem;color:var(--muted)}
.pbar a.quit{font-size:.9rem}
.main{flex:1;display:flex;min-height:0;position:relative}
.board{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background:var(--scene-bg,#1d252b);
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:24px 24px}
.board.panning{cursor:grabbing}
.board.t-measure,.board.t-calib{cursor:crosshair}
.board.t-ping{cursor:cell}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.layer{position:absolute;left:0;top:0}
.it{position:absolute;user-select:none;-webkit-user-drag:none}
.it img{width:100%;height:100%;display:block;pointer-events:none;object-fit:fill}
.it.round img{object-fit:cover;border-radius:50%}
.it.round{border-radius:50%}
.it.tok{box-shadow:0 0 0 3px var(--oc,#ddd),0 3px 8px rgba(0,0,0,.55)}
.it .ini{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:var(--oc,#667);color:#fff;font-family:var(--f-display);font-weight:800}
.it .nm{position:absolute;left:50%;top:100%;transform:translate(-50%,4px);white-space:nowrap;font-size:13px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.6);padding:1px 7px;border-radius:999px;pointer-events:none}
.it.grab{cursor:move}
.it.sel{outline:2px solid #e3b341;outline-offset:3px}
.it.lockd{outline-style:dashed}
.layer.gm .it{opacity:.55;outline:2px dashed #b06cc4;outline-offset:2px}
.board.lay-gm .layer.gm .it{opacity:.9}
.handle{position:absolute;right:-9px;bottom:-9px;width:16px;height:16px;border-radius:4px;background:#e3b341;border:2px solid #1d1a16;cursor:nwse-resize}
svg.fx{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:100000}
/* chaque couche a son propre empilement : carte < pions < couche MJ (les z-index des éléments restent dans leur couche) */
.layer.map{z-index:1}.layer.tokens{z-index:2}.layer.gm{z-index:3}
.fxlab{font:700 14px var(--f-body);paint-order:stroke;stroke:#000;stroke-width:4px;fill:#fff}
@keyframes ping{from{r:6;opacity:1}to{r:70;opacity:0}}
.ping circle{animation:ping 1.1s ease-out 3}
.insp{width:290px;flex:0 0 290px;background:var(--sheet);border-left:1px solid var(--line);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.insp[hidden]{display:none}
.insp h2{font-size:1.1rem}
.insp .r{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insp .acts{display:flex;flex-wrap:wrap;gap:6px}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;align-items:center;z-index:3}
.hud button{padding:4px 10px;background:var(--sheet)}
.hud span{background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.85rem}
.msg{position:absolute;inset:0;display:grid;place-items:center;z-index:2;pointer-events:none}
.msg>div{pointer-events:auto;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:18px 22px;max-width:440px;text-align:center;display:flex;flex-direction:column;gap:10px}
.toastp{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.9rem;z-index:4}
dialog.dlg{border:1px solid var(--line);border-radius:14px;padding:16px;max-width:min(480px, calc(100vw - 24px));background:var(--sheet);color:var(--ink)}
dialog.dlg::backdrop{background:rgba(0,0,0,.5)}
dialog.dlg form{display:flex;flex-direction:column;gap:10px}
.calib{position:absolute;z-index:4;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;gap:6px;align-items:end}
@media (max-width:760px){.insp{position:absolute;right:0;top:0;bottom:0;width:min(290px,90vw);z-index:4}}
</style>
</head>
<body>
<header class="pbar" id="pbar">
  <a class="brand" href="index.html">Un'Gara</a>
  <span id="camp-name" style="font-weight:700"></span>
  <div class="grp" id="g-scene"><span class="lab">Scène</span><select id="scene-sel" aria-label="Scène"></select>
    <span id="scene-live" class="pill" hidden></span></div>
  <div class="grp" id="g-layer" hidden><span class="lab">Couche</span>
    <div class="seg" role="group" aria-label="Couche active">
      <button type="button" data-layer="map">Carte</button><button type="button" data-layer="tokens" class="on">Pions</button><button type="button" data-layer="gm">MJ (cachée)</button></div></div>
  <div class="grp"><span class="lab">Outil</span>
    <div class="seg" role="group" aria-label="Outil">
      <button type="button" data-tool="select" class="on" title="Sélection et déplacement (V)">Déplacer</button>
      <button type="button" data-tool="measure" title="Mesurer une distance (M)">Mesurer</button>
      <button type="button" data-tool="ping" title="Pinger un endroit (P) — Alt + clic marche avec tous les outils">Ping</button>
      <button type="button" data-tool="calib" id="tool-calib" hidden title="Étalonner l'échelle : trace une ligne de longueur connue">Échelle</button></div></div>
  <div class="grp" id="g-gm" hidden>
    <button type="button" id="b-add">Ajouter une image</button>
    <button type="button" id="b-chars">Ajouter les personnages</button>
    <button type="button" id="b-scene">Scène…</button>
  </div>
  <span class="sp"></span>
  <span class="who" id="who"></span>
  <a class="quit" id="quit" href="index.html">Quitter le plateau</a>
</header>

<div class="main">
  <div class="board" id="board" aria-label="Plateau de jeu">
    <div class="world" id="world">
      <div class="layer map" id="L-map"></div>
      <div class="layer tokens" id="L-tokens"></div>
      <div class="layer gm" id="L-gm"></div>
      <svg class="fx" id="fx" width="1" height="1"><g id="fx-static"></g><g id="fx-pings"></g></svg>
    </div>
    <div class="hud"><button type="button" id="z-out" aria-label="Dézoomer">−</button><span id="z-val">100 %</span><button type="button" id="z-in" aria-label="Zoomer">+</button>
      <button type="button" id="z-fit">Recentrer</button><span id="scale-info"></span></div>
    <div class="msg" id="msg" hidden><div id="msg-in"></div></div>
    <div class="toastp" id="toastp" hidden></div>
  </div>
  <aside class="insp" id="insp" hidden aria-label="Élément sélectionné"></aside>
</div>

<!-- Ajouter une image (MJ) -->
<dialog class="dlg" id="d-add" aria-labelledby="d-add-h">
  <form method="dialog" id="f-add">
    <h2 id="d-add-h">Ajouter une image</h2>
    <label class="f">Depuis ton ordinateur<input type="file" id="a-file" accept="image/*"></label>
    <label class="f">… ou adresse web de l'image<input id="a-url" placeholder="https://…"></label>
    <div class="r" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <label class="f">Couche<select id="a-layer"><option value="map">Carte</option><option value="tokens">Pions</option><option value="gm">MJ (cachée)</option></select></label>
      <label class="f">Nom<input id="a-name" maxlength="60" placeholder="ex. Gobelin"></label>
    </div>
    <label class="chk"><input type="checkbox" id="a-round"> Pion rond (taille en mètres)</label>
    <label class="f" id="a-size-l">Diamètre du pion (m)<input type="number" id="a-size" min="0.5" max="30" step="0.5" value="1.5"></label>
    <p class="status" id="a-st" role="status"></p>
    <div class="row" style="justify-content:flex-end"><button type="button" id="a-cancel">Annuler</button><button class="primary" type="button" id="a-ok">Ajouter</button></div>
  </form>
</dialog>

<!-- Réglages de la scène (MJ) -->
<dialog class="dlg" id="d-scene" aria-labelledby="d-scene-h">
  <form method="dialog">
    <h2 id="d-scene-h">Scène</h2>
    <label class="f">Nom<input id="s-name" maxlength="80"></label>
    <label class="f">Échelle : pixels pour 1 mètre<input type="number" id="s-scale" min="2" max="2000" step="any"></label>
    <p class="hint" style="margin:0">Plus simple : outil « Échelle », trace une ligne sur une distance connue de la carte (ex. une porte = 1,5 m).</p>
    <label class="f">Couleur du fond<input type="color" id="s-bg" style="height:38px;width:70px;padding:2px"></label>
    <p class="status" id="s-st" role="status"></p>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button type="button" id="s-new">Nouvelle scène</button><button type="button" class="danger" id="s-del">Supprimer la scène</button></div>
      <div class="row"><button type="button" id="s-cancel">Fermer</button><button class="primary" type="button" id="s-ok">Enregistrer</button></div>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/jdr-supabase.js"></script>
<script src="js/jdr-rules.js"></script>
<script src="js/jdr-ui.js"></script>
<script>
/* ======================= État ======================= */
const CAMP = new URLSearchParams(location.search).get('campagne');
let me = null, camp = null, isGM = false;
let scenes = [], scene = null;                 // scène affichée
let items = new Map();                         // id → élément du plateau
let chars = [];                                // personnages de la campagne (MJ : tous ; joueur : les siens)
let layer = 'tokens', tool = 'select';
let view = { x: 0, y: 0, z: 1 };               // déplacement et zoom de la vue
let sel = null;                                // id de l'élément sélectionné
let channel = null;
const DEFAULT_SCALE = 50;                      // pixels par mètre
// Portées du livret (en mètres) : servent aux cercles et au nom de la portée mesurée
const RANGES = [['Contact', 1.5], ['Allonge', 3], ['Proche', 9], ['Moyenne portée', 18], ['Grande portée', 36], ['Très grande portée', 72]];
const RING_RANGES = RANGES.slice(0, 4);

const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for(const [a, v] of Object.entries(attrs)){ if(a === 'class') e.className = v; else if(a.startsWith('on')) e.addEventListener(a.slice(2), v); else if(a === 'text') e.textContent = v; else if(v !== false && v != null) e.setAttribute(a, v === true ? '' : v); } kids.forEach(k => e.append(k)); return e; };
const scale = () => (scene && Number(scene.data.scale)) || DEFAULT_SCALE;
const fmtM = m => (Math.round(m * 10) / 10).toLocaleString('fr-FR') + ' m';
const rangeName = m => { const r = RANGES.find(([, d]) => m <= d + 0.05); return r ? r[0] : 'Trop loin'; };
function userColor(id){ let h = 0; for(const c of String(id || '')) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h} 70% 55%)`; }
function toast(t){ const e = $id('toastp'); e.textContent = t; e.hidden = false; clearTimeout(e._h); e._h = setTimeout(() => e.hidden = true, 2600); }
function showMsg(html){ $id('msg-in').innerHTML = html; $id('msg').hidden = !html; }

/* ======================= Droits ======================= */
// MJ : tout ; joueur : seulement ses pions (couche pions), jamais la carte ni la couche cachée
const canMove = it => isGM ? (it.layer === layer && !it.data.locked) : (it.layer === 'tokens' && it.owner_id === me.id && !it.data.locked);
const controls = it => isGM || (it.layer === 'tokens' && it.owner_id === me.id);

/* ======================= Vue (déplacement / zoom) ======================= */
function applyView(){
  $id('world').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  $id('z-val').textContent = Math.round(view.z * 100) + ' %';
}
function zoomAt(f, cx, cy){
  const b = $id('board').getBoundingClientRect();
  const px = cx - b.left, py = cy - b.top;
  const nz = Math.min(6, Math.max(0.1, view.z * f));
  view.x = px - (px - view.x) * nz / view.z; view.y = py - (py - view.y) * nz / view.z; view.z = nz; applyView();
}
function toWorld(cx, cy){ const b = $id('board').getBoundingClientRect(); return { x: (cx - b.left - view.x) / view.z, y: (cy - b.top - view.y) / view.z }; }
function centerOn(wx, wy){ const b = $id('board').getBoundingClientRect(); view.x = b.width / 2 - wx * view.z; view.y = b.height / 2 - wy * view.z; applyView(); }
function fitAll(){
  const list = [...items.values()];
  if(!list.length){ view = { x: 0, y: 0, z: 1 }; centerOn(0, 0); return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  list.forEach(i => { x0 = Math.min(x0, i.data.x); y0 = Math.min(y0, i.data.y); x1 = Math.max(x1, i.data.x + i.data.w); y1 = Math.max(y1, i.data.y + i.data.h); });
  const b = $id('board').getBoundingClientRect();
  view.z = Math.min(2, Math.max(0.1, Math.min(b.width / (x1 - x0 + 80), b.height / (y1 - y0 + 80))));
  centerOn((x0 + x1) / 2, (y0 + y1) / 2);
}
$id('z-in').addEventListener('click', () => { const b = $id('board').getBoundingClientRect(); zoomAt(1.25, b.left + b.width / 2, b.top + b.height / 2); });
$id('z-out').addEventListener('click', () => { const b = $id('board').getBoundingClientRect(); zoomAt(0.8, b.left + b.width / 2, b.top + b.height / 2); });
$id('z-fit').addEventListener('click', fitAll);
$id('board').addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });

/* ======================= Affichage des éléments ======================= */
function normItem(row){
  const d = Object.assign({ name: '', img: '', x: 0, y: 0, w: 75, h: 75, rot: 0, round: false, locked: false, z: 0 }, row.data || {});
  ['x','y','w','h','rot','z'].forEach(k => d[k] = Number(d[k]) || 0);
  if(d.w < 4) d.w = 4; if(d.h < 4) d.h = 4;
  return Object.assign({}, row, { data: d });
}
function renderItem(it){
  let e = document.getElementById('it-' + it.id);
  const L = $id('L-' + it.layer);
  if(!e){ e = el('div', { id: 'it-' + it.id, class: 'it', 'data-id': it.id }); }
  if(e.parentElement !== L) L.append(e);
  const d = it.data, owner = it.owner_id;
  e.className = 'it' + (d.round ? ' round tok' : '') + (canMove(it) ? ' grab' : '') + (sel === it.id ? ' sel' : '') + (d.locked ? ' lockd' : '');
  e.style.cssText = `left:${d.x}px;top:${d.y}px;width:${d.w}px;height:${d.h}px;transform:rotate(${d.rot}deg);z-index:${Math.round(d.z) + 1000};--oc:${owner ? userColor(owner) : '#9aa4ab'}`;
  e.title = d.name || '';
  const kids = [];
  if(d.img){ const img = el('img', { src: d.img, alt: '', draggable: 'false' }); kids.push(img); }
  else kids.push(el('div', { class: 'ini', text: (d.name || '?')[0].toUpperCase(), style: `font-size:${Math.max(12, d.h * .45)}px;${d.round ? '' : 'border-radius:8px'}` }));
  if(d.name && (d.round || it.layer === 'tokens')) kids.push(el('span', { class: 'nm', text: d.name, style: `font-size:${Math.max(11, 13 / view.z)}px` }));
  if(sel === it.id && isGM && it.layer === layer && !d.locked) kids.push(el('div', { class: 'handle', 'data-handle': '1', title: 'Redimensionner' }));
  e.replaceChildren(...kids);
}
function removeItemEl(id){ const e = document.getElementById('it-' + id); if(e) e.remove(); }
function renderAll(){
  ['map','tokens','gm'].forEach(l => $id('L-' + l).replaceChildren());
  [...items.values()].forEach(renderItem);
  $id('L-gm').hidden = !isGM;
  renderInspector();
}

/* ======================= Inspecteur (MJ) ======================= */
function renderInspector(){
  const box = $id('insp'); const it = sel && items.get(sel);
  if(!isGM || !it){ box.hidden = true; return; }
  box.hidden = false; const d = it.data, s = scale();
  const num = (lab, val, step, on) => { const i = el('input', { type: 'number', step, value: val }); i.addEventListener('change', () => on(Number(i.value))); return el('label', { class: 'f' }, document.createTextNode(lab), i); };
  const name = el('input', { value: d.name, maxlength: 60 }); name.addEventListener('change', () => save(it, { name: name.value.trim() }));
  const lay = el('select', {}, ...[['map','Carte'],['tokens','Pions'],['gm','MJ (cachée)']].map(([v, t]) => el('option', { value: v, text: t })));
  lay.value = it.layer; lay.addEventListener('change', () => saveRow(it, { layer: lay.value }));
  const own = el('select', {}, el('option', { value: '', text: '— personne (MJ) —' }), ...chars.map(c => el('option', { value: c.id, text: c.name || 'Sans nom' })));
  own.value = it.character_id || ''; own.addEventListener('change', () => { const c = chars.find(x => x.id === own.value); saveRow(it, { character_id: c ? c.id : null, owner_id: c ? c.owner_id : null }); });
  const lock = el('input', { type: 'checkbox' }); lock.checked = !!d.locked; lock.addEventListener('change', () => save(it, { locked: lock.checked }));
  const round = el('input', { type: 'checkbox' }); round.checked = !!d.round; round.addEventListener('change', () => save(it, { round: round.checked }));
  const zs = [...items.values()].filter(x => x.layer === it.layer).map(x => x.data.z);
  box.replaceChildren(
    el('h2', { text: d.name || 'Élément' }),
    el('label', { class: 'f' }, document.createTextNode('Nom'), name),
    el('div', { class: 'r' },
      el('label', { class: 'f' }, document.createTextNode('Couche'), lay),
      d.round ? num('Diamètre (m)', Math.round(d.w / s * 10) / 10, 0.5, v => v > 0 && save(it, { w: v * s, h: v * s }))
              : num('Largeur (m)', Math.round(d.w / s * 10) / 10, 0.5, v => v > 0 && save(it, { w: v * s, h: d.h * (v * s) / d.w }))),
    el('div', { class: 'r' }, num('Rotation (°)', d.rot, 15, v => save(it, { rot: v })), el('span')),
    el('label', { class: 'f' }, document.createTextNode('Contrôlé par (fiche liée)'), own),
    el('label', { class: 'chk' }, round, document.createTextNode(' Pion rond')),
    el('label', { class: 'chk' }, lock, document.createTextNode(' Verrouillé (ne bouge plus)')),
    el('div', { class: 'acts' },
      el('button', { type: 'button', text: 'Devant', onclick: () => save(it, { z: Math.max(...zs) + 1 }) }),
      el('button', { type: 'button', text: 'Derrière', onclick: () => save(it, { z: Math.min(...zs) - 1 }) }),
      el('button', { type: 'button', text: 'Centrer la vue', onclick: () => centerOn(d.x + d.w / 2, d.y + d.h / 2) })),
    el('div', { class: 'acts' },
      el('button', { type: 'button', text: 'Dupliquer', onclick: () => duplicate(it) }),
      el('button', { type: 'button', class: 'danger', text: 'Supprimer', onclick: () => delItem(it) })),
    el('p', { class: 'hint', style: 'margin:0', text: 'Glisse le carré jaune pour redimensionner. Touche Suppr pour supprimer.' }));
}

/* ======================= Enregistrement ======================= */
async function save(it, patch){              // modifie data
  Object.assign(it.data, patch); renderItem(it); renderInspector();
  const { error } = await jdrSb.from('board_items').update({ data: it.data }).eq('id', it.id);
  if(error) toast(jdrErrorText(error));
}
async function saveRow(it, patch){           // modifie une colonne (couche, propriétaire)
  // passage dans la couche cachée : les joueurs ne recevront plus cet élément → on leur dit de l'enlever
  if(patch.layer === 'gm' && it.layer !== 'gm') send('hide', { id: it.id });
  Object.assign(it, patch); renderItem(it); renderInspector();
  const { error } = await jdrSb.from('board_items').update(patch).eq('id', it.id);
  if(error) toast(jdrErrorText(error));
}
async function insertItem(row){
  const { data, error } = await jdrSb.from('board_items').insert(Object.assign({ scene_id: scene.id }, row)).select().single();
  if(error){ toast(jdrErrorText(error)); return null; }
  const it = normItem(data); items.set(it.id, it); renderItem(it); return it;
}
async function delItem(it){
  const { error } = await jdrSb.from('board_items').delete().eq('id', it.id);
  if(error){ toast(jdrErrorText(error)); return; }
  items.delete(it.id); removeItemEl(it.id); if(sel === it.id) select(null);
}
async function duplicate(it){

  const n = await insertItem({ layer: it.layer, owner_id: it.owner_id, character_id: it.character_id, data: d }); if(n) select(n.id);
}
function select(id){ const old = sel; sel = id; [old, id].forEach(x => { const it = x && items.get(x); if(it) renderItem(it); }); renderInspector(); }

/* ======================= Effets : mesure, ping, cercles ======================= */
const fx = { measures: new Map(), rings: null };     // mesures en cours (par utilisateur), cercles survolés
function drawFx(){
  const s = scale(), k = 1 / view.z; const parts = [];
  if(fx.rings){
    const it = items.get(fx.rings); if(it){ const d = it.data, cx = d.x + d.w / 2, cy = d.y + d.h / 2, r0 = Math.max(d.w, d.h) / 2;
      RING_RANGES.forEach(([n, m], i) => { const r = r0 + m * s;
        parts.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${i === 0 ? 'rgba(227,179,65,.10)' : 'none'}" stroke="rgba(227,179,65,${.85 - i * .15})" stroke-width="${2 * k}" stroke-dasharray="${i ? 8 * k + ' ' + 6 * k : 'none'}"/>`,
          `<text class="fxlab" x="${cx}" y="${cy - r - 4 * k}" text-anchor="middle" style="font-size:${13 * k}px;stroke-width:${4 * k}px">${n} · ${fmtM(m)}</text>`); }); }
  }
  fx.measures.forEach(m => {
    const dx = m.b.x - m.a.x, dy = m.b.y - m.a.y, px = Math.hypot(dx, dy), met = px / s;
    const lab = m.calib ? `${Math.round(px)} px` : `${fmtM(met)} · ${rangeName(met)}`;
    parts.push(`<line x1="${m.a.x}" y1="${m.a.y}" x2="${m.b.x}" y2="${m.b.y}" stroke="${m.color}" stroke-width="${3 * k}" stroke-linecap="round"/>`,
      `<circle cx="${m.a.x}" cy="${m.a.y}" r="${5 * k}" fill="${m.color}"/><circle cx="${m.b.x}" cy="${m.b.y}" r="${5 * k}" fill="${m.color}"/>`,
      `<text class="fxlab" x="${m.b.x + 10 * k}" y="${m.b.y - 10 * k}" style="font-size:${15 * k}px;stroke-width:${4 * k}px">${jdrEsc(lab)}${m.who ? ' — ' + jdrEsc(m.who) : ''}</text>`);
  });
  $id('fx-static').innerHTML = parts.join('');   // les pings vivent à part (#fx-pings) : leur animation n'est pas relancée
}
function showPing(p){
  const k = 1 / view.z;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'ping');
  g.innerHTML = `<circle cx="${p.x}" cy="${p.y}" r="6" fill="none" stroke="${p.color}" stroke-width="${4 * k}"/><circle cx="${p.x}" cy="${p.y}" r="${6 * k}" fill="${p.color}" style="animation:none"/>`
    + (p.who ? `<text class="fxlab" x="${p.x}" y="${p.y - 18 * k}" text-anchor="middle" style="font-size:${13 * k}px;stroke-width:${4 * k}px">${jdrEsc(p.who)}</text>` : '');
  $id('fx-pings').append(g); setTimeout(() => g.remove(), 3400);
  if(p.focus) centerOn(p.x, p.y);
}

/* ======================= Temps réel ======================= */
let lastSend = 0;
function send(event, payload){ if(channel) channel.send({ type: 'broadcast', event, payload }); }
function sendThrottled(event, payload){ const t = performance.now(); if(t - lastSend > 45){ lastSend = t; send(event, payload); } }
function subscribe(){
  channel = jdrSb.channel('jdr-plateau-' + CAMP, { config: { broadcast: { self: false } } })
    .on('postgres_changes', { event: '*', schema: 'jdr', table: 'board_items', filter: 'campaign_id=eq.' + CAMP }, onItemChange)
    .on('postgres_changes', { event: '*', schema: 'jdr', table: 'scenes', filter: 'campaign_id=eq.' + CAMP }, onSceneChange)
    .on('postgres_changes', { event: 'UPDATE', schema: 'jdr', table: 'campaigns', filter: 'id=eq.' + CAMP }, onCampChange)
    .on('broadcast', { event: 'drag' }, ({ payload }) => { if(drag && drag.id === payload.id) return; const it = items.get(payload.id); if(it && it.layer !== 'gm' && scene && payload.scene === scene.id){ Object.assign(it.data, { x: payload.x, y: payload.y }); renderItem(it); } })
    .on('broadcast', { event: 'hide' }, ({ payload }) => { if(!isGM && items.has(payload.id)){ items.delete(payload.id); removeItemEl(payload.id); } })
    .on('broadcast', { event: 'measure' }, ({ payload }) => { if(!scene || payload.scene !== scene.id) return; if(payload.clear) fx.measures.delete(payload.uid); else fx.measures.set(payload.uid, payload); drawFx(); })
    .on('broadcast', { event: 'ping' }, ({ payload }) => { if(scene && payload.scene === scene.id) showPing(Object.assign({}, payload, { focus: payload.focus && !isGM })); })
    .subscribe(st => { if(st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') toast('Temps réel indisponible : recharge la page si les autres ne bougent plus.'); });
}
function onItemChange({ eventType, new: n, old: o }){
  if(eventType === 'DELETE'){ if(o && items.has(o.id)){ items.delete(o.id); removeItemEl(o.id); if(sel === o.id) select(null); } return; }
  if(!scene || n.scene_id !== scene.id){ if(items.has(n.id)){ items.delete(n.id); removeItemEl(n.id); } return; }
  if(drag && drag.id === n.id) return;                               // je suis en train de le déplacer
  const it = normItem(n); items.set(it.id, it); renderItem(it); if(sel === it.id) renderInspector();
}
function onSceneChange({ eventType, new: n, old: o }){
  if(eventType === 'DELETE'){ scenes = scenes.filter(s => s.id !== o.id); fillScenes(); if(scene && scene.id === o.id){ scene = null; loadScene(isGM ? (scenes[0] || {}).id : camp.active_scene); } return; }
  const i = scenes.findIndex(s => s.id === n.id); if(i >= 0) scenes[i] = n; else scenes.push(n);
  if(scene && scene.id === n.id){ scene = n; applyScene(); }
  fillScenes();
}
function onCampChange({ new: n }){
  const was = camp.active_scene; camp = Object.assign(camp, n); fillScenes();
  if(!isGM && n.active_scene !== was){ loadScene(n.active_scene); toast('Le MJ change de scène'); }
}

/* ======================= Scènes ======================= */
function fillScenes(){
  const s = $id('scene-sel');
  if(isGM){
    s.replaceChildren(...scenes.map(x => el('option', { value: x.id, text: (x.id === camp.active_scene ? '● ' : '') + x.name })));
    if(!scenes.length) s.append(el('option', { value: '', text: 'Aucune scène' }));
    s.value = scene ? scene.id : '';
    const live = $id('scene-live'); live.hidden = !scene;
    if(scene){ const on = scene.id === camp.active_scene; live.className = 'pill' + (on ? ' good' : ''); live.textContent = on ? 'Vue par les joueurs' : 'Montrer aux joueurs';
      live.style.cursor = on ? 'default' : 'pointer'; live.title = on ? '' : 'Afficher cette scène chez tous les joueurs'; }
  } else {
    s.replaceChildren(el('option', { value: scene ? scene.id : '', text: scene ? scene.name : 'En attente du MJ' })); s.disabled = true;
  }
}

function applyScene(){

async function loadScene(id){

    showMsg(isGM ? '<h2>Aucune scène</h2><p style="margin:0">Une scène, c\'est une carte avec ses pions (un donjon, une ville…).</p><button class="primary" type="button" onclick="newScene()">Créer une scène</button>'

function imgSize(url){ return new Promise(res => { const i = new Image(); i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => res(null); i.src = url; }); }
async function upload(file){
  const ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${CAMP}/${crypto.randomUUID()}.${ext}`;
  const { error } = await jdrSb.storage.from('jdr-plateau').upload(path, file, { contentType: file.type, upsert: false });
  if(error) throw error;
  return jdrSb.storage.from('jdr-plateau').getPublicUrl(path).data.publicUrl;
}
$id('a-ok').addEventListener('click', async () => {
  const file = $id('a-file').files[0]; let url = $id('a-url').value.trim();

    const zs = [...items.values()].filter(x => x.layer === L).map(x => x.data.z);
    const name = $id('a-name').value.trim() || (file ? file.name.replace(/\.[^.]+$/, '') : '');
    const it = await insertItem({ layer: L, data: { name, img: url, x: c.x - w / 2, y: c.y - h / 2, w, h, rot: 0, round, locked: false, z: zs.length ? Math.max(...zs) + 1 : 0 } });

  const k = e.key.toLowerCase();
  if(k === 'v') setTool('select'); else if(k === 'm') setTool('measure'); else if(k === 'p') setTool('ping');
  else if(k === 'escape'){ select(null); setTool('select'); }

  else if(k === '+' || k === '='){ $id('z-in').click(); } else if(k === '-'){ $id('z-out').click(); }

/* ======================= Souris / doigt sur le plateau ======================= */
let drag = null;              // { id, dx, dy } déplacement d'un élément
let pan = null, meas = null, resize = null;
const myColor = () => userColor(me.id);
const myName = () => $id('who').textContent || '';
$id('board').addEventListener('pointerdown', e => {
  if(e.target.closest('.msg>div, .hud, .calib, .toastp')) return;     // boutons posés sur le plateau
  if(e.button === 1 || e.button === 2){ pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; $id('board').classList.add('panning'); $id('board').setPointerCapture(e.pointerId); return; }
  if(e.button !== 0) return;
  const p = toWorld(e.clientX, e.clientY);
  // Alt + clic = ping avec n'importe quel outil (Maj + Alt pour le MJ : centre la vue des joueurs)
  if(tool === 'ping' || e.altKey){ const pl = { scene: scene && scene.id, x: p.x, y: p.y, color: myColor(), who: myName(), focus: isGM && e.shiftKey }; showPing(pl); send('ping', pl); return; }
  const itEl = e.target.closest('.it'); const it = itEl && items.get(itEl.dataset.id);
  if(tool === 'measure' || tool === 'calib'){
    const a = it && it.layer === 'tokens' ? { x: it.data.x + it.data.w / 2, y: it.data.y + it.data.h / 2 } : p;   // depuis le centre d'un pion
    meas = { a, b: a, color: tool === 'calib' ? '#e3b341' : myColor(), who: tool === 'calib' ? '' : myName(), calib: tool === 'calib', uid: me.id, scene: scene && scene.id };
    fx.measures.set(me.id, meas); drawFx(); $id('board').setPointerCapture(e.pointerId); return;
  }
  if(e.target.dataset.handle && it){ resize = { id: it.id, x: p.x, y: p.y, w: it.data.w, h: it.data.h }; $id('board').setPointerCapture(e.pointerId); return; }
  if(it && canMove(it)){
    select(isGM ? it.id : null);
    drag = { id: it.id, dx: p.x - it.data.x, dy: p.y - it.data.y, moved: false }; $id('board').setPointerCapture(e.pointerId); return;
  }
  if(isGM && it && it.layer === layer) select(it.id); else select(null);
  pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; $id('board').classList.add('panning'); $id('board').setPointerCapture(e.pointerId);
});
$id('board').addEventListener('pointermove', e => {
  const p = toWorld(e.clientX, e.clientY);
  if(pan){ view.x = pan.vx + e.clientX - pan.x; view.y = pan.vy + e.clientY - pan.y; applyView(); return; }
  if(drag){ const it = items.get(drag.id); if(!it) return; it.data.x = p.x - drag.dx; it.data.y = p.y - drag.dy; drag.moved = true;
    const e2 = document.getElementById('it-' + it.id); if(e2){ e2.style.left = it.data.x + 'px'; e2.style.top = it.data.y + 'px'; }
    if(fx.rings === it.id) drawFx();
    if(it.layer !== 'gm') sendThrottled('drag', { id: it.id, x: it.data.x, y: it.data.y, scene: scene.id }); return; }
  if(resize){ const it = items.get(resize.id); if(!it) return; const f = Math.max(0.05, (resize.w + (p.x - resize.x)) / resize.w);
    it.data.w = resize.w * f; it.data.h = resize.h * f; const e2 = document.getElementById('it-' + it.id); if(e2){ e2.style.width = it.data.w + 'px'; e2.style.height = it.data.h + 'px'; } return; }
  if(meas){ meas.b = p; drawFx(); if(!meas.calib) sendThrottled('measure', meas); return; }
  // Survol : cercles de portée autour des pions que je contrôle
  const itEl = e.target.closest && e.target.closest('.it'); const it = itEl && items.get(itEl.dataset.id);
  const ring = it && it.data.round && controls(it) && tool === 'select' ? it.id : null;
  if(ring !== fx.rings){ fx.rings = ring; drawFx(); }
});
async function endPointer(){
  if(pan){ pan = null; $id('board').classList.remove('panning'); }
  if(drag){ const d = drag; drag = null; const it = items.get(d.id);
    if(it && d.moved){ send('drag', { id: it.id, x: it.data.x, y: it.data.y, scene: scene.id });
      const { error } = await jdrSb.from('board_items').update({ data: it.data }).eq('id', it.id); if(error) toast(jdrErrorText(error)); } }
  if(resize){ const it = items.get(resize.id); resize = null; if(it) save(it, { w: it.data.w, h: it.data.h }); }
  if(meas){ const m = meas; meas = null;
    if(m.calib){ openCalib(m); return; }
    send('measure', m); setTimeout(() => { if(fx.measures.get(me.id) === m){ fx.measures.delete(me.id); drawFx(); send('measure', { uid: me.id, clear: true, scene: m.scene }); } }, 2500); }
}
$id('board').addEventListener('pointerup', endPointer);

/* ======================= Étalonnage de l'échelle (MJ) ======================= */
function openCalib(m){
  closeCalib(); const px = Math.hypot(m.b.x - m.a.x, m.b.y - m.a.y); if(px < 5){ fx.measures.delete(me.id); drawFx(); return; }
  const b = $id('board').getBoundingClientRect();
  const inp = el('input', { type: 'number', min: '0.1', step: '0.1', value: '1.5', style: 'width:6rem' });
  const box = el('div', { class: 'calib', id: 'calib', style: `left:${Math.min(b.width - 260, m.b.x * view.z + view.x + 12)}px;top:${Math.max(8, m.b.y * view.z + view.y + 12)}px` },
    el('label', { class: 'f' }, document.createTextNode('Cette ligne mesure (m)'), inp),
    el('button', { type: 'button', class: 'primary', text: 'Appliquer', onclick: async () => {
      const metres = Number(inp.value); if(!(metres > 0)) return;
      const data = Object.assign({}, scene.data, { scale: px / metres });
      const { error } = await jdrSb.from('scenes').update({ data }).eq('id', scene.id);
      if(error){ toast(jdrErrorText(error)); return; }
      scene.data = data; closeCalib(); applyScene(); setTool('measure'); toast(`Échelle réglée : 1 m = ${Math.round(px / metres)} px`); } }),
    el('button', { type: 'button', text: 'Annuler', onclick: closeCalib }));
  $id('board').append(box); inp.focus(); inp.select();
}
function closeCalib(){ const c = $id('calib'); if(c) c.remove(); if(fx.measures.has(me && me.id) && fx.measures.get(me.id).calib){ fx.measures.delete(me.id); drawFx(); } }

/* ======================= Démarrage ======================= */
async function chooseCampaign(){
  // Pas de campagne dans l'adresse : liste des parties où je suis MJ ou joueur
  const { data } = await jdrSb.from('campaigns').select('id,name,gm_id').order('created_at', { ascending: false });
  const list = data || [];
  showMsg('<h2>Choisis une partie</h2>' + (list.length ? list.map(c => `<a class="primary" style="display:block;padding:8px 12px;border-radius:8px;text-decoration:none;border:1px solid var(--line)" href="plateau.html?campagne=${c.id}">${jdrEsc(c.name)} <span class="hint">${c.gm_id === me.id ? '(tu es MJ)' : '(joueur)'}</span></a>`).join('')
    : '<p style="margin:0">Tu n’es dans aucune partie. Le MJ crée une campagne et te donne son code (Joueur → Rejoindre une partie).</p>'));
}
(async () => {
  if(!jdrSb){ showMsg('<p>Connexion au serveur impossible.</p>'); return; }
  me = await jdrPage('plateau', { requireLogin: true, noNav: true }); if(!me) return;
  $id('who').textContent = await jdrUsername(me);
  $id('who').style.color = userColor(me.id);
  if(!CAMP){ $id('pbar').querySelectorAll('.grp').forEach(g => g.hidden = true); return chooseCampaign(); }
  const { data: c, error } = await jdrSb.from('campaigns').select('id,name,gm_id,active_scene').eq('id', CAMP).maybeSingle();
  if(error || !c){ showMsg('<h2>Partie introuvable</h2><p style="margin:0">Ce plateau n’existe pas, ou tu n’en fais pas partie.</p><a href="plateau.html">Voir mes parties</a>'); return; }
  camp = c; isGM = c.gm_id === me.id;
  document.title = c.name + " — Plateau Un'Gara";
  $id('camp-name').textContent = c.name + (isGM ? ' · MJ' : '');
  $id('quit').href = isGM ? 'campagnes.html' : 'joueur.html';
  $id('g-layer').hidden = !isGM; $id('g-gm').hidden = !isGM; $id('tool-calib').hidden = !isGM;
  if(!isGM) layer = 'tokens';
  const [sc, ch] = await Promise.all([
    jdrSb.from('scenes').select('*').eq('campaign_id', CAMP).order('created_at'),
    jdrSb.from('characters').select('id,name,owner_id,data').eq('campaign_id', CAMP).order('name')
  ]);
  scenes = sc.data || []; chars = ch.data || [];
  subscribe(); applyView();
  await loadScene(isGM ? (c.active_scene || (scenes[0] || {}).id) : c.active_scene);
})();
</script>
