<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliothèque Un'Gara</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/jdr-ui.css">
<style>
/* Layout : filtres à gauche (repliables sur téléphone), grille de cartes à droite */
.lib{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.lib{grid-template-columns:1fr}}
.filters{position:sticky;top:12px}
.filters .ff{display:flex;flex-direction:column;gap:10px}
@media (max-width:820px){.filters{position:static}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;justify-items:center}
.cards .jcard{--w:210px;cursor:pointer;transition:transform .12s}
.cards .jcard:hover{transform:translateY(-3px)}
.cards button.cardbtn{border:0;padding:0;background:none;border-radius:12px}
@media (min-width:560px){.cards .cardbtn:has(.jcrea){grid-column:span 2}}
.cards .jcrea{cursor:pointer}
dialog.wide{max-width:min(1100px,96vw)}
dialog.wide .detail{grid-template-columns:1fr}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--sheet);color:var(--ink);max-width:min(720px,94vw);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.55)}
.detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
.detail .jcard{--w:300px}
@media (max-width:600px){.detail{grid-template-columns:1fr;justify-items:center}}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}
.detail dt{color:var(--muted)} .detail dd{margin:0}
@media (prefers-reduced-motion:reduce){.cards .jcard{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div><h1>Bibliothèque</h1><p class="sub" id="count"></p></div>
    <label class="f" style="min-width:240px">Afficher pour le personnage<select id="char"><option value="">Aucun (toutes les cartes)</option></select></label>
  </div>
  <p class="status" id="status" role="status"></p>
  <div class="lib">
    <aside class="sheet filters"><details open id="fdet"><summary style="cursor:pointer;font-weight:700;margin-bottom:8px">Filtres</summary><div id="filters"></div></details></aside>
    <main><div class="cards" id="grid"></div></main>
  </div>
</div>

<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="detail">
    <div id="dlg-card"></div>
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <h2 id="dlg-title"></h2>
      <dl id="dlg-info"></dl>
      <div id="dlg-kw"></div>
      <p id="dlg-allowed" class="status"></p>
      <div class="row"><a id="dlg-edit" href="#" hidden>Modifier dans l'éditeur</a><button type="button" id="dlg-close">Fermer</button></div>
    </div>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/jdr-supabase.js"></script>
<script src="js/jdr-rules.js"></script>
<script src="js/jdr-ui.js"></script>
<script src="js/jdr-card-render.js"></script>
<script src="js/jdr-filters.js"></script>
<script src="js/jdr-origins.js"></script>
<script>
let all = [], chars = [], sheet = null, groups = {};
const F = jdrFilters($id('filters'), render, { showPlayable: true });
if(matchMedia('(max-width:820px)').matches) $id('fdet').open = false;

function allowed(c){ return sheet ? jdrCardAllowed(c, sheet).ok : true; }

function render(){
  const list = F.apply(all, { sheet, allowed });
  $id('count').textContent = `${list.length} carte${list.length > 1 ? 's' : ''} sur ${all.length}`;
  const g = $id('grid');
  if(!all.length){ g.innerHTML = `<p class="empty">Aucune carte n'a encore été créée.${JDR_IS_EDITOR ? ' <a href="editeur-cartes.html">Créer la première</a>' : ''}</p>`; return; }
  if(!list.length){ g.innerHTML = '<p class="empty">Aucune carte ne correspond aux filtres.</p>'; return; }
  g.innerHTML = list.map(c => `<button type="button" class="cardbtn" data-id="${jdrEsc(c.id)}" aria-label="${jdrEsc(c.name)}">${jdrCardHTML(c, { sheet, locked: !allowed(c), groups, width: 'min(434px, calc(100vw - 48px))' })}</button>`).join('');
}
$id('grid').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if(b) openDetail(b.dataset.id); });

function openDetail(id){
  const c = all.find(x => x.id === id); if(!c) return;
  const isC = c.type === 'Créature';
  $id('dlg').classList.toggle('wide', isC);
  $id('dlg-card').innerHTML = jdrCardHTML(c, isC ? { sheet, groups, width: 'min(1040px, calc(96vw - 40px))' } : { sheet, groups });
  $id('dlg-title').textContent = c.name;
  const acc = (l, all) => l.length ? l.join(', ') : all;
  const rows = [
    ['Type', [c.type, c.subtype].filter(Boolean).join(' — ')],
    ['Super-types', acc(c.supertypes, 'Aucun')],
    ['Classes', acc(c.classes, 'Toutes')],
    ['Réservée à', acc(c.restrict, 'Tout le monde')],
    ['Valeur', c.value ?? '—'], ['Mana', c.mana !== null && c.mana !== '' ? c.mana : '—'],
    ['Prérequis', c.requirements.length ? c.requirements.map(r => `${JDR_STAT_LABEL[r.stat]} ${r.min}`).join(', ') : 'Aucun'],
    ['Exemplaires', c.horsDeck ? 'Hors deck (1)' : (c.maxCopies ? c.maxCopies + ' maximum' : 'Illimité')]
  ];
  $id('dlg-info').innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${jdrEsc(v)}</dd>`).join('');
  // Mots-clés de la carte (ajoutés + ceux de ses super-types) avec leur définition
  const kws = jdrCardKeywords(c);
  $id('dlg-kw').innerHTML = kws.length ? `<p class="hint" style="margin:6px 0 2px">Mots-clés</p><dl>${kws.map(k =>
    `<dt><a href="mots-cles.html?id=${encodeURIComponent(k.id)}">${jdrEsc(k.label)}</a></dt><dd>${jdrEsc(k.text) || '<i>Définition à écrire.</i>'}</dd>`).join('')}</dl>` : '';
  const a = sheet ? jdrCardAllowed(c, sheet) : null;
  $id('dlg-allowed').textContent = a ? (a.ok ? `${sheet.name || 'Ce personnage'} peut mettre cette carte dans son deck.` : 'Non jouable : ' + a.reasons.join(' · ')) : '';
  $id('dlg-allowed').className = 'status ' + (a ? (a.ok ? 'good' : 'bad') : '');
  $id('dlg-edit').hidden = !JDR_IS_EDITOR; $id('dlg-edit').href = 'editeur-cartes.html?id=' + encodeURIComponent(c.id);
  $id('dlg').showModal();
}
$id('dlg-close').addEventListener('click', () => $id('dlg').close());
$id('dlg').addEventListener('click', e => { if(e.target === $id('dlg')) $id('dlg').close(); });

$id('char').addEventListener('change', e => {
  const c = chars.find(x => x.id === e.target.value);
  sheet = c ? Object.assign({}, c.data, { name: c.name }) : null;
  try{ localStorage.setItem('jdr-lib-char', e.target.value); }catch(err){}
  render();
});

(async () => {
  if(!jdrSb){ $id('status').textContent = 'Connexion au serveur impossible.'; return; }
  const me = await jdrPage('bibliotheque', { requireLogin: true }); if(!me) return;
  try{
    const [cardsRes, charsRes, groupsRes] = await Promise.all([
      jdrLoadCards(),
      jdrSb.from('characters').select('id,name,data').eq('owner_id', me.id).order('updated_at', { ascending: false }),
      jdrLoadGroups(),
      jdrLoadOrigins().catch(err => console.warn('[jdr] origines non chargées (magie selon le manuel V1) :', err))
    ]);
    groups = groupsRes.byId;
    all = cardsRes.list;
    chars = charsRes.data || [];
    chars.forEach(c => $id('char').append(new Option(c.name || 'Sans nom', c.id)));
    let saved = ''; try{ saved = localStorage.getItem('jdr-lib-char') || ''; }catch(err){}
    if(saved && chars.some(c => c.id === saved)){ $id('char').value = saved; $id('char').dispatchEvent(new Event('change')); }
  }catch(err){ $id('status').textContent = jdrErrorText(err); $id('status').className = 'status bad'; }
  render();
})();
</script>
</body>
</html>
